<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bill K Official — Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div id="loginView" class="auth-wrap">
    <div class="auth-card">
      <div class="brand">BILL K <span>OFFICIAL</span></div>
      <p class="muted">Artist Hub Administration</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button class="primary" type="submit">Sign in</button>
        <button id="resetBtn" class="link-btn" type="button">Forgot password?</button>
        <p id="loginMsg" class="message"></p>
      </form>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand">BILL K <span>OFFICIAL</span></div>
      <nav id="nav">
        <button data-section="dashboard">Dashboard</button>
        <button data-section="site">Site Settings</button>
        <button data-section="music">Music</button>
        <button data-section="albums">Albums</button>
        <button data-section="videos">Videos</button>
        <button data-section="events">Events & Tickets</button>
        <button data-section="ministry">Ministry</button>
        <button data-section="gallery">Gallery</button>
        <button data-section="about">About / Bio</button>
        <button data-section="socials">Social Media</button>
      </nav>
      <button id="logoutBtn" class="logout">Sign out</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><strong id="sectionTitle">Dashboard</strong><span id="userEmail"></span></div>
        <a href="../" target="_blank" class="view-site">View website ↗</a>
      </header>

      <section id="dashboard" class="section active">
        <div class="hero"><h1>Welcome back, Bill K Official.</h1><p>Manage your artist hub without editing code.</p></div>
        <div id="stats" class="stats"></div>
        <div class="panel"><h2>Quick actions</h2><div class="quick">
          <button data-go="music">＋ Add song</button><button data-go="albums">＋ Add album</button>
          <button data-go="videos">＋ Add video</button><button data-go="events">＋ Add event</button>
        </div></div>
      </section>

      <section id="site" class="section"><div class="panel"><h2>Site Settings</h2><form id="siteForm" class="form-grid">
        <label>Artist name<input name="artistName"></label><label>Slogan<input name="slogan"></label>
        <label>Scripture<input name="scripture"></label><label>Hero title<input name="heroTitle"></label>
        <label class="wide">Hero text<textarea name="heroText"></textarea></label>
        <label>Booking WhatsApp<input name="whatsapp"></label><label>Booking phone<input name="phone"></label>
        <label>Booking email<input name="email"></label><label>Profile image URL<input name="profileImage"></label>
        <label class="wide">Featured announcement<textarea name="announcement"></textarea></label>
        <div class="wide"><button class="primary" type="submit">Save site settings</button><span id="siteMsg" class="message"></span></div>
      </form></div></section>

      <section id="music" class="section"><div class="panel"><div class="section-head"><h2>Music</h2><button class="primary" data-add="songs">＋ Add song</button></div><div id="songsList" class="cards"></div></div></section>
      <section id="albums" class="section"><div class="panel"><div class="section-head"><h2>Albums / EPs</h2><button class="primary" data-add="albums">＋ Add album</button></div><div id="albumsList" class="cards"></div></div></section>
      <section id="videos" class="section"><div class="panel"><div class="section-head"><h2>Videos</h2><button class="primary" data-add="videos">＋ Add video</button></div><div id="videosList" class="cards"></div></div></section>
      <section id="events" class="section"><div class="panel"><div class="section-head"><h2>Events & Tickets</h2><button class="primary" data-add="events">＋ Add event</button></div><div id="eventsList" class="cards"></div></div></section>
      <section id="ministry" class="section"><div class="panel"><div class="section-head"><h2>Ministry</h2><button class="primary" data-add="ministry">＋ Add ministry item</button></div><div id="ministryList" class="cards"></div></div></section>
      <section id="gallery" class="section"><div class="panel"><div class="section-head"><h2>Gallery</h2><button class="primary" data-add="gallery">＋ Add photo</button></div><div id="galleryList" class="cards"></div></div></section>
      <section id="about" class="section"><div class="panel"><h2>About / Biography</h2><form id="aboutForm">
        <label>Biography<textarea name="bio" rows="12"></textarea></label>
        <button class="primary" type="submit">Save biography</button><span id="aboutMsg" class="message"></span>
      </form></div></section>
      <section id="socials" class="section"><div class="panel"><h2>Social Media</h2><form id="socialForm" class="form-grid">
        <label>YouTube<input name="youtube"></label><label>TikTok<input name="tiktok"></label>
        <label>Instagram<input name="instagram"></label><label>Facebook<input name="facebook"></label>
        <label>Spotify<input name="spotify"></label><label>Apple Music<input name="appleMusic"></label>
        <label>Boomplay<input name="boomplay"></label><label>Audiomack<input name="audiomack"></label>
        <div class="wide"><button class="primary" type="submit">Save social links</button><span id="socialMsg" class="message"></span></div>
      </form></div></section>
    </main>
  </div>

  <dialog id="editor">
    <form method="dialog" id="editorForm" class="dialog-card">
      <div class="section-head"><h2 id="editorTitle">Edit</h2><button type="button" id="closeEditor">×</button></div>
      <div id="editorFields" class="form-grid"></div>
      <div class="dialog-actions"><button type="button" id="cancelEditor">Cancel</button><button class="primary" type="submit">Save</button></div>
      <p id="editorMsg" class="message"></p>
    </form>
  </dialog>

  <script type="module" src="../js/admin.js"></script>
</body>
</html>
